<title>Лабораторная работа №8 — Математическое моделирование</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #111;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
  .deck {
    width: 100vw;
    height: 100vh;
    position: relative;
  }
  .slide {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: #111;
  }
  .slide.active { display: flex; }
  .slide img {
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
    object-fit: contain;
    box-shadow: 0 0 35px rgba(0,0,0,.45);
  }
  .counter {
    position: fixed;
    right: 16px;
    bottom: 12px;
    background: rgba(0,0,0,.55);
    padding: 5px 9px;
    border-radius: 5px;
    font-size: 13px;
    color: #ddd;
    z-index: 10;
  }
  .hint {
    position: fixed;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    background: rgba(0,0,0,.55);
    padding: 6px 12px;
    border-radius: 5px;
    font-size: 12px;
    color: #ddd;
    z-index: 10;
    transition: opacity .5s;
  }
  .controls {
    position: fixed;
    left: 16px;
    bottom: 12px;
    z-index: 10;
    display: flex;
    gap: 6px;
  }
  button {
    border: 0;
    border-radius: 5px;
    background: rgba(0,0,0,.55);
    color: white;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { background: rgba(0,0,0,.75); }
</style>

<div class="hint" id="hint">Используйте ← → или клавиши PageUp/PageDown для переключения слайдов</div>

<script>
let current = 0;
const slides = document.querySelectorAll('.slide');

function showSlide(n) {
  current = (n + slides.length) % slides.length;
  slides.forEach((s, i) => s.classList.toggle('active', i === current));
}

function nextSlide() { showSlide(current + 1); }
function prevSlide() { showSlide(current - 1); }

document.addEventListener('keydown', (e) => {
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) {
    e.preventDefault();
    nextSlide();
  } else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) {
    e.preventDefault();
    prevSlide();
  } else if (e.key === 'Home') {
    showSlide(0);
  } else if (e.key === 'End') {
    showSlide(slides.length - 1);
  } else if (e.key === 'Escape') {
    document.documentElement.requestFullscreen?.().catch(() => {});
  }
});

document.querySelector('.hint').addEventListener('click', e => e.stopPropagation());
showSlide(0);

setTimeout(() => {
  const hint = document.getElementById('hint');
  if (hint) hint.style.opacity = '0';
}, 5000);
</script>
